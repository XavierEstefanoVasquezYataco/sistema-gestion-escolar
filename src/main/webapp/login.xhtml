<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Iniciar Sesión - EduManager Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&amp;display=swap" rel="stylesheet"/>
    <style>
        /* RESET Y FONDO A PANTALLA COMPLETA */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            /* Imagen de fondo moderna de alta calidad con color de respaldo offline */
            background: #0f172a url('https://images.unsplash.com/photo-1562774053-701939374585?q=80&amp;w=1920&amp;auto=format&amp;fit=crop') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CAPA OSCURA PARA RESALTAR EL LOGIN */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8) 0%, rgba(30, 58, 138, 0.6) 100%);
            z-index: 1;
        }

        /* CONTENEDOR EFECTO CRISTAL (GLASSMORPHISM) */
        .login-box {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px 50px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: white;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CABECERA DEL LOGIN */
        .login-box i.logo-icon {
            font-size: 3.5rem;
            color: #60a5fa;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(96, 165, 250, 0.5);
        }

        .login-box h2 {
            margin: 0 0 5px 0;
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .login-box p {
            margin: 0 0 30px 0;
            font-weight: 300;
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        /* ESTILIZANDO LOS INPUTS DE PRIMEFACES */
        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 400;
            color: #e2e8f0;
            letter-spacing: 0.5px;
        }

        /* Forzando el estilo sobre PrimeFaces */
        body .ui-inputfield {
            width: 100% !important;
            box-sizing: border-box !important;
            background: rgba(255, 255, 255, 0.15) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: white !important;
            padding: 12px 15px !important;
            border-radius: 8px !important;
            font-family: 'Poppins', sans-serif !important;
            font-size: 1rem !important;
            transition: all 0.3s ease !important;
            box-shadow: none !important;
        }

        body .ui-inputfield:focus {
            background: rgba(255, 255, 255, 0.25) !important;
            border-color: #60a5fa !important;
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.3) !important;
        }
        
        /* Cambiar color del placeholder */
        body .ui-inputfield::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* BOTÓN DE LOGIN INTERACTIVO */
        body .btn-login.ui-button {
            width: 100% !important;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%) !important;
            border: none !important;
            padding: 12px 0 !important;
            font-size: 1.1rem !important;
            font-weight: 600 !important;
            border-radius: 8px !important;
            letter-spacing: 1px !important;
            transition: transform 0.2s, box-shadow 0.2s !important;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4) !important;
        }

        body .btn-login.ui-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.6) !important;
        }

        body .btn-login.ui-button:active {
            transform: translateY(1px);
        }

        /* MENSAJES DE ERROR */
        body .ui-messages .ui-messages-error {
            background: rgba(239, 68, 68, 0.2) !important;
            border: 1px solid rgba(239, 68, 68, 0.5) !important;
            color: #fca5a5 !important;
            border-radius: 8px !important;
        }

        /* RESPONSIVIDAD PARA MÓVILES */
        @media (max-width: 480px) {
            .login-box {
                padding: 30px 20px !important;
                width: 90% !important;
                border-radius: 16px !important;
            }
            .login-box h2 {
                font-size: 1.5rem !important;
            }
            .login-box i.logo-icon {
                font-size: 2.8rem !important;
            }
        }
    </style>
</h:head>
<h:body>
    <div class="overlay"></div>
    
    <div class="login-box">
        <i class="pi pi-bolt logo-icon"></i>
        <h2>EduManager Pro</h2>
        <p>Sistema de Gestión Académica</p>
        
        <h:form id="loginForm">
            <p:messages id="messages" showDetail="true" closable="true">
                <p:autoUpdate/>
            </p:messages>

            <div class="input-group">
                <label for="username">Usuario Institucional</label>
                <p:inputText id="username" value="#{loginBean.usuario}" placeholder="Ej: admin" required="true" requiredMessage="El usuario es obligatorio"/>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <p:password id="password" value="#{loginBean.password}" placeholder="••••••••" required="true" requiredMessage="La contraseña es obligatoria" toggleMask="true"/>
            </div>

            <p:commandButton value="INGRESAR AL SISTEMA" action="#{loginBean.login}" styleClass="btn-login" ajax="false" icon="pi pi-sign-in" iconPos="right"/>
        </h:form>
    </div>
</h:body>
</html>
