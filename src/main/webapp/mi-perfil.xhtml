<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                template="/templates/template.xhtml">

    <ui:define name="title">Mi Perfil - EduManager Pro</ui:define>

    <ui:define name="content">
        <h:form id="perfilForm">
            <p:growl id="mensajes" showDetail="true" />
            
            <div style="max-width: 800px; width: 100%; box-sizing: border-box; margin: 0 auto; background: white; padding: 28px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
                <h2 style="color: #1e293b; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; margin-top: 0;">Información Personal</h2>
                
                <h:panelGroup rendered="#{portalEstudianteBean.miEstudiante eq null}">
                    <p:messages severity="warn">
                        <p:autoUpdate/>
                        Su usuario no tiene un perfil de estudiante vinculado. Contacte al administrador.
                    </p:messages>
                </h:panelGroup>

                <p:outputPanel rendered="#{portalEstudianteBean.miEstudiante ne null}" class="ui-fluid">
                    <div class="formgrid grid" style="display: flex; gap: 20px; margin-bottom: 15px;">
                        <div class="field col" style="flex: 1;">
                            <p:outputLabel value="Documento de Identidad (DNI)" />
                            <p:inputText value="#{portalEstudianteBean.miEstudiante.dni}" readonly="true" style="background-color: #f8fafc;" />
                        </div>
                        <div class="field col" style="flex: 1;">
                            <p:outputLabel value="Fecha de Nacimiento" />
                            <p:inputText value="#{portalEstudianteBean.miEstudiante.fechaNacimiento}" readonly="true" style="background-color: #f8fafc;" />
                        </div>
                    </div>

                    <div class="formgrid grid" style="display: flex; gap: 20px; margin-bottom: 15px;">
                        <div class="field col" style="flex: 1;">
                            <p:outputLabel value="Nombres" />
                            <p:inputText value="#{portalEstudianteBean.miEstudiante.nombres}" readonly="true" style="background-color: #f8fafc;" />
                        </div>
                        <div class="field col" style="flex: 1;">
                            <p:outputLabel value="Apellidos" />
                            <p:inputText value="#{portalEstudianteBean.miEstudiante.apellidos}" readonly="true" style="background-color: #f8fafc;" />
                        </div>
                    </div>

                    <p:divider align="left"><b>Datos Editables</b></p:divider>

                    <div class="field" style="margin-bottom: 15px;">
                        <p:outputLabel for="direccion" value="Dirección de Residencia" />
                        <p:inputText id="direccion" value="#{portalEstudianteBean.miEstudiante.direccion}" />
                    </div>

                    <div class="field" style="margin-bottom: 25px;">
                        <p:outputLabel for="password" value="Nueva Contraseña (Dejar en blanco para mantener la actual)" />
                        <p:password id="password" value="#{portalEstudianteBean.nuevaContrasena}" toggleMask="true" feedback="true" promptLabel="Ingrese contraseña" weakLabel="Débil" goodLabel="Buena" strongLabel="Fuerte"/>
                    </div>

                    <div class="modal-footer-actions" style="margin-top: 20px;">
                        <p:commandButton value="Actualizar Mis Datos" icon="pi pi-check" actionListener="#{portalEstudianteBean.actualizarPerfil}"
                                         update="mensajes @form" styleClass="ui-button-primary" />
                    </div>
                </p:outputPanel>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
