<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                template="/templates/template.xhtml">

    <ui:define name="title">Roles del Sistema - EduManager Pro</ui:define>

    <ui:define name="content">
        <h:form id="form">
            <p:growl id="mensajes" showDetail="true" />

            <p:toolbar style="margin-bottom: 20px;">
                <p:toolbarGroup>
                    <p:commandButton value="Nuevo Rol" icon="pi pi-plus" actionListener="#{rolBean.nuevoRol}"
                                     update=":dialogoForm" oncomplete="PF('dialogoRol').show()"
                                     styleClass="ui-button-success" style="margin-right: .5rem" />
                </p:toolbarGroup>
            </p:toolbar>

            <p:dataTable id="dt-roles" widgetVar="dtRoles" var="rol" value="#{rolBean.roles}"
                         reflow="true" paginator="true" rows="10" rowKey="#{rol.id}"
                         paginatorPosition="bottom" emptyMessage="No se encontraron roles registrados."
                         style="box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
                
                <f:facet name="header">
                    <div style="font-weight: bold; font-size: 1.2rem; padding: 10px 0;">Gestión de Roles</div>
                </f:facet>

                <p:column headerText="ID" width="100" sortBy="#{rol.id}">
                    <h:outputText value="#{rol.id}" />
                </p:column>

                <p:column headerText="Nombre del Rol" sortBy="#{rol.nombre}" filterBy="#{rol.nombre}">
                    <h:outputText value="#{rol.nombre}" style="font-weight: bold;"/>
                </p:column>

                <p:column headerText="Descripción">
                    <h:outputText value="#{rol.descripcion}" />
                </p:column>

                <p:column exportable="false" width="100" style="text-align: center;">
                    <p:commandButton icon="pi pi-pencil" update=":dialogoForm"
                                     oncomplete="PF('dialogoRol').show()"
                                     styleClass="edit-button rounded-button ui-button-info ui-button-flat" process="@this">
                        <f:setPropertyActionListener value="#{rol}" target="#{rolBean.rolSeleccionado}" />
                    </p:commandButton>
                    <p:commandButton class="ui-button-danger rounded-button ui-button-flat" icon="pi pi-trash"
                                     process="@this" oncomplete="PF('eliminarRolDialog').show()">
                        <f:setPropertyActionListener value="#{rol}" target="#{rolBean.rolSeleccionado}" />
                    </p:commandButton>
                </p:column>
            </p:dataTable>
        </h:form>

        <p:dialog header="Detalle del Rol" showEffect="fade" modal="true" widgetVar="dialogoRol" responsive="true" style="max-width: 480px; width: 95vw;">
            <h:form id="dialogoForm">
                <p:outputPanel id="rol-contenido" class="ui-fluid">
                    <div class="field" style="margin-bottom: 15px;">
                        <p:outputLabel for="nombre" value="Nombre del Rol (Ej: SECRETARIA)" />
                        <p:inputText id="nombre" value="#{rolBean.rolSeleccionado.nombre}" required="true" requiredMessage="El nombre es obligatorio."/>
                    </div>
                    
                    <div class="field" style="margin-bottom: 15px;">
                        <p:outputLabel for="descripcion" value="Descripción (Opcional)" />
                        <p:inputTextarea id="descripcion" value="#{rolBean.rolSeleccionado.descripcion}" rows="3" />
                    </div>
                </p:outputPanel>
                
                <div class="modal-footer-actions" style="margin-top: 20px;">
                    <p:commandButton value="Guardar" icon="pi pi-save" actionListener="#{rolBean.guardarRol}"
                                     update="rol-contenido :form:mensajes :form:dt-roles" process="rol-contenido @this" styleClass="ui-button-primary" />
                    <p:commandButton value="Cancelar" icon="pi pi-times" onclick="PF('dialogoRol').hide()"
                                     styleClass="ui-button-secondary ui-button-flat" type="button" />
                </div>
            </h:form>
        </p:dialog>

        <p:confirmDialog widgetVar="eliminarRolDialog" showEffect="fade" style="max-width: 380px; width: 92vw;"
                         message="¿Está seguro de eliminar este rol?" header="Confirmar Eliminación" severity="warn">
            <h:form>
                <p:commandButton value="Sí, Eliminar" icon="pi pi-check" actionListener="#{rolBean.eliminarRol}"
                                 process="@this" oncomplete="PF('eliminarRolDialog').hide()" styleClass="ui-button-danger" />
                <p:commandButton value="Cancelar" type="button" styleClass="ui-button-secondary ui-button-flat" icon="pi pi-times"
                                 onclick="PF('eliminarRolDialog').hide()" />
            </h:form>
        </p:confirmDialog>
    </ui:define>
</ui:composition>
